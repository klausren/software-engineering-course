<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 554" font-family="Arial">
  <rect x="0" y="0" width="960" height="554" fill="#FFFFFF"/>
  <rect x="20" y="96" width="215" height="84" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="127.5" y="115.0" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Listen</text>
  <text x="127.5" y="131.0" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal">collect a wish, not a spec</text>
  <text x="127.5" y="147.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">倾听</text>
  <text x="127.5" y="166" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="normal">收集愿望，而不是规格</text>
  <rect x="255" y="96" width="215" height="84" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="362.5" y="115.0" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Build</text>
  <text x="362.5" y="131.0" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal">a mock-up in days, not months</text>
  <text x="362.5" y="147.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">构建</text>
  <text x="362.5" y="166" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="normal">用几天而不是几个月做原型</text>
  <defs><marker id="arrow7824" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
  <path d="M237,138.0 L251,138.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow7824)"/>
  <rect x="490" y="96" width="215" height="84" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="597.5" y="115.0" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Test</text>
  <text x="597.5" y="131.0" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal">watch what they do, do not ask</text>
  <text x="597.5" y="147.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">试用</text>
  <text x="597.5" y="166" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="normal">看用户怎么做，而不是问</text>
  <defs><marker id="arrow43202" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
  <path d="M472,138.0 L486,138.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow43202)"/>
  <rect x="725" y="96" width="215" height="84" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="832.5" y="115.0" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Revise</text>
  <text x="832.5" y="131.0" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal">the requirement moves as you build</text>
  <text x="832.5" y="147.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">修改</text>
  <text x="832.5" y="166" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="normal">边做边改，需求随之移动</text>
  <defs><marker id="arrow73419" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
  <path d="M707,138.0 L721,138.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow73419)"/>
  <path d="M832.5,180 L832.5,224" fill="none" stroke="#D97706" stroke-width="1.8" stroke-dasharray="6 5"/>
  <path d="M127.5,180 L127.5,224" fill="none" stroke="#D97706" stroke-width="1.8" stroke-dasharray="6 5"/>
  <defs><marker id="arrow72772" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs>
  <path d="M832.5,224 L129.5,224" fill="none" stroke="#D97706" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow72772)"/>
  <text x="480" y="216" text-anchor="middle" font-size="11.5" fill="#D97706" font-weight="normal">repeat until the requirements become clear  循环直到需求清晰</text>
  <text x="480" y="266" text-anchor="middle" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="italic">then the team chooses one of two roads</text>
  <text x="480" y="282.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-family="Hiragino Sans GB">然后团队在两条路中选一条</text>
  <rect x="20" y="286" width="440" height="52" rx="8" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/>
  <text x="240.0" y="305.0" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Throwaway prototyping</text>
  <text x="240.0" y="321.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">抛弃型原型</text>
  <text x="40" y="362" text-anchor="start" font-size="12" fill="#6B7280" font-weight="normal">The mock-up taught you what to build. Discard it and build the real system</text>
  <text x="40" y="379" text-anchor="start" font-size="12" fill="#6B7280" font-weight="normal">properly.</text>
  <text x="40" y="398" text-anchor="start" font-size="11" fill="#6B7280" font-weight="normal">原型帮你搞清要做什么。丢掉它，认真做真正的系统。</text>
  <rect x="500" y="286" width="440" height="52" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="720.0" y="305.0" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Evolutionary prototyping</text>
  <text x="720.0" y="321.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">演化型原型</text>
  <text x="520" y="362" text-anchor="start" font-size="12" fill="#6B7280" font-weight="normal">The prototype is promoted to the product, defensible only if it was built to</text>
  <text x="520" y="379" text-anchor="start" font-size="12" fill="#6B7280" font-weight="normal">be maintained.</text>
  <text x="520" y="398" text-anchor="start" font-size="11" fill="#6B7280" font-weight="normal">原型直接升级为产品；只有当初就按可维护做的原型才站得住脚。</text>
  <text x="480" y="472" text-anchor="middle" font-size="13" fill="#6B7280" font-style="italic">The classic failure is not the prototype. It is shipping it.</text>
  <text x="480" y="488" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="normal" font-style="italic">原型本身从来不是灾难，把它当成产品发出去才是。</text>
  <text x="480" y="532" text-anchor="middle" font-size="11.5" fill="#9CA3AF">Figure after OOSE textbook (CC BY 4.0) · 图据教材重绘</text>
</svg>
