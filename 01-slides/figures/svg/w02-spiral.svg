  <circle cx="245" cy="258" r="4" fill="#2563EB"/>
  <circle cx="369" cy="135" r="13" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="369" y="139" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold">1</text>
  <circle cx="369" cy="383" r="13" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="369" y="387" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold">2</text>
  <circle cx="121" cy="383" r="13" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="121" y="387" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold">3</text>
  <circle cx="121" cy="135" r="13" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="121" y="139" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold">4</text>
  <text x="245" y="466" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="italic">each loop = one iteration</text>
  <text x="245" y="481.5" text-anchor="middle" font-size="11.5" fill="#6B7280" font-family="Hiragino Sans GB">每圈 = 一轮迭代</text>
  <circle cx="510" cy="92" r="13" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="510" y="96" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold">1</text>
  <text x="536" y="96" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="normal">Determine objectives, alternatives &amp; constraints</text>
  <text x="536" y="113" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal">确定目标、备选方案与约束</text>
  <circle cx="510" cy="154" r="13" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="510" y="158" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold">2</text>
  <text x="536" y="158" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="normal">Evaluate alternatives, identify &amp; resolve risks</text>
  <text x="536" y="175" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal">评估备选方案，识别并解决风险</text>
  <circle cx="510" cy="216" r="13" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="510" y="220" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold">3</text>
  <text x="536" y="220" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="normal">Develop &amp; verify the next-level product</text>
  <text x="536" y="237" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal">开发并验证下一级产品</text>
  <circle cx="510" cy="278" r="13" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="510" y="282" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold">4</text>
  <text x="536" y="282" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="normal">Plan the next iteration</text>
  <text x="536" y="299" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal">计划下一轮迭代</text>
  <text x="500" y="300" text-anchor="start" font-size="12" fill="#6B7280" font-weight="normal" font-style="italic">the growing radius ≈ cumulative cost</text>
  <text x="500" y="315.5" text-anchor="start" font-size="11.5" fill="#6B7280" font-family="Hiragino Sans GB">半径随累积成本增大</text>
  <text x="480" y="370" text-anchor="middle" font-size="13" fill="#6B7280" font-style="italic">Risk is addressed explicitly and early, which is why the spiral suits large</text>
  <text x="480" y="386" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal">or high-risk work — and why its ceremony is hard to justify on a small one.</text>
  <text x="480" y="401.5" text-anchor="middle" font-size="11.5" fill="#6B7280" font-family="Hiragino Sans GB">风险被显式且及早处理，所以螺旋适合大型或高风险项目——也正因如此，小型项目负担不起它的仪式。</text>
  <text x="480" y="430" text-anchor="middle" font-size="11.5" fill="#9CA3AF">Figure after OOSE textbook (CC BY 4.0) · 图据教材重绘</text>
</svg>
