  <text x="293.0" y="139.0" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal">project plan</text>
  <text x="293.0" y="155.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">策划</text>
  <defs><marker id="arrow64815" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
  <path d="M193,137.0 L204,137.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow64815)"/>
  <rect x="395" y="104" width="170" height="66" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="480.0" y="123.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Modeling</text>
  <text x="480.0" y="139.0" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal">analysis &amp; design</text>
  <text x="480.0" y="155.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">建模</text>
  <defs><marker id="arrow90397" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
  <path d="M380,137.0 L391,137.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow90397)"/>
  <rect x="582" y="104" width="170" height="66" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="667.0" y="123.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Construction</text>
  <text x="667.0" y="139.0" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal">code &amp; test</text>
  <text x="667.0" y="155.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">构建</text>
  <defs><marker id="arrow79852" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
  <path d="M567,137.0 L578,137.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow79852)"/>
  <rect x="769" y="104" width="170" height="66" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="854.0" y="123.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Deployment</text>
  <text x="854.0" y="139.0" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal">delivery &amp; support</text>
  <text x="854.0" y="155.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">部署</text>
  <defs><marker id="arrow63375" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
  <path d="M754,137.0 L765,137.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow63375)"/>
  <path d="M854.0,170 L854.0,226" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6 5"/>
  <path d="M106.0,170 L106.0,226" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6 5"/>
  <defs><marker id="arrow492" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
  <path d="M854.0,226 L108.0,226" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow492)"/>
  <text x="480" y="216" text-anchor="middle" font-size="11.5" fill="#DC2626" font-weight="normal">feedback arrives only here — 反馈只在最后出现</text>
  <text x="480" y="272" text-anchor="middle" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="italic">each phase completes before the next begins</text>
  <text x="480" y="288.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-family="Hiragino Sans GB">每个阶段完成后才进入下一阶段</text>
  <text x="480" y="312" text-anchor="middle" font-size="13" fill="#6B7280" font-style="italic">Simple and documentation-driven, but uncertainty has nowhere to go:</text>
  <text x="480" y="328" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal">defects and wrong requirements surface when they are dearest to fix.</text>
  <text x="480" y="343.5" text-anchor="middle" font-size="11.5" fill="#6B7280" font-family="Hiragino Sans GB">简单、文档驱动；但不确定性无处安放——缺陷与需求错误在最贵的时候才暴露。</text>
  <text x="480" y="372" text-anchor="middle" font-size="11.5" fill="#9CA3AF">Figure after OOSE textbook (CC BY 4.0) · 图据教材重绘</text>
</svg>
