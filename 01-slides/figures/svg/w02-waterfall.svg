<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 394" font-family="Arial">
  <rect x="0" y="0" width="960" height="394" fill="#FFFFFF"/>
  <rect x="21" y="104" width="170" height="66" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="106.0" y="123.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Communication</text>
  <text x="106.0" y="139.0" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal">requirements</text>
  <text x="106.0" y="155.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-family="Hiragino Sans GB">沟通</text>
  <rect x="208" y="104" width="170" height="66" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
