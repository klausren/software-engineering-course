  <text x="385.33333333333337" y="296" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Hiragino Sans GB">增量 2 · alert 告警</text>
  <defs><marker id="arrow52194" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <path d="M385.33333333333337,330 L385.33333333333337,348" fill="none" stroke="#2E7D46" stroke-width="1.8" marker-end="url(#arrow52194)"/>
