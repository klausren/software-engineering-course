  <text x="557.3333333333333" y="156" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Hiragino Sans GB">构建</text>
  <rect x="700.6666666666666" y="122" width="229.33333333333337" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="815.3333333333333" y="141" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold">Test and acceptance</text>
  <text x="815.3333333333333" y="156" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Hiragino Sans GB">测试与验收</text>
