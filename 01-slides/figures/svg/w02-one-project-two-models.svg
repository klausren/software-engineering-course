  <text x="614.6666666666667" y="296" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Hiragino Sans GB">增量 3 · escalate 升级</text>
  <defs><marker id="arrow58551" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <path d="M614.6666666666667,330 L614.6666666666667,348" fill="none" stroke="#2E7D46" stroke-width="1.8" marker-end="url(#arrow58551)"/>
  <rect x="758.0" y="262" width="172.0" height="46" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <text x="844.0" y="281" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold">Increment 4</text>
  <text x="844.0" y="296" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Hiragino Sans GB">增量 4 · harden 加固</text>
  <defs><marker id="arrow90293" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <path d="M844.0,330 L844.0,348" fill="none" stroke="#2E7D46" stroke-width="1.8" marker-end="url(#arrow90293)"/>
  <text x="480" y="366" text-anchor="middle" font-size="11.5" fill="#2E7D46" font-weight="normal">working software every four weeks — feedback from week 4</text>
  <text x="480" y="381.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-family="Hiragino Sans GB">每四周就有可用软件——从第 4 周起就有反馈</text>
  <text x="480" y="418" text-anchor="middle" font-size="13" fill="#6B7280" font-style="italic">Same requirements, same team, same sixteen weeks.</text>
  <text x="480" y="434" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="normal" font-style="italic">The model decides when reality is allowed to talk back.</text>
  <text x="480" y="450.5" text-anchor="middle" font-size="11.5" fill="#6B7280" font-family="Hiragino Sans GB">需求相同、团队相同、周数相同。模型决定的，是现实什么时候被允许说话。</text>
  <text x="480" y="478" text-anchor="middle" font-size="11.5" fill="#9CA3AF">Figure after OOSE textbook (CC BY 4.0) · 图据教材重绘</text>
