  <path d="M414.0,190 L872.6666666666666,190" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow79725)"/>
  <text x="643.3333333333333" y="204" text-anchor="middle" font-size="11.5" fill="#DC2626" font-weight="normal">first user feedback arrives here — expensive to act on</text>
  <text x="643.3333333333333" y="219.0" text-anchor="middle" font-size="11.5" fill="#6B7280" font-family="Hiragino Sans GB">用户第一次看到东西在这里——此时改动已经很贵</text>
  <text x="20" y="278" text-anchor="start" font-size="12.5" fill="#0D9488" font-weight="bold">Incremental</text>
  <text x="20" y="294.0" text-anchor="start" font-size="11.5" fill="#6B7280" font-family="Hiragino Sans GB">增量</text>
  <rect x="70.0" y="262" width="172.0" height="46" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <text x="156.0" y="281" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold">Increment 1</text>
  <text x="156.0" y="296" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Hiragino Sans GB">增量 1 · monitor 监测</text>
